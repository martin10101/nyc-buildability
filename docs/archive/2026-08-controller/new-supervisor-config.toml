# NYC Buildability Supervisor — IMMUTABLE controller config (D-007 §3.1)
# Manifest-covered. Drafted 2026-08-04 for the M0-T036 Phase 5 shadow pilot;
# effective only when the owner places it at the controller location.
# [limits] carries ONLY the owner-authorized revision-loop raise (D-074,
# owner 2026-09-19, resolving DB-012 after 16 trips); every OTHER fail-closed
# default from tools/agent_supervisor/config.py Limits applies unchanged.

[controller]
default_mode = "shadow"

[limits]
max_consecutive_revision_loops = 6

[codex]
# Both verified accepted on the installed codex-cli 0.146.0 (Phase 0, 2026-08-03).
allowed_models = ["gpt-6-astra", "gpt-5.6-sol", "gpt-5.6-terra"]

[claude]
# Empty list = only the account/CLI default may be used; no explicit Claude
# selection is permitted (directive §3.1). Most conservative pilot posture.
allowed_models = ["claude-fable-5", "claude-opus-4-8"]
[approved_models]
models = ["claude-fable-5", "claude-opus-4-8"]
