<rect x="0.00" y="0.00" width="468.00" height="224.00" fill="#FFFFFF"/>
<g data-drawing-part="area_allocation" data-apartment-fraction="0.65"><text x="24.00" y="30.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="area_percentage">65% apartment area</text><rect x="24.00" y="44.00" width="189.80" height="44.00" fill="#EEF4F7" stroke="#52616C" stroke-width="0.75" data-role="area_bar_apartment"/><rect x="24.00" y="44.00" width="189.80" height="44.00" fill="url(#aa-hatch-apartment)" stroke="none"/><rect x="213.80" y="44.00" width="102.20" height="44.00" fill="#EEF4F7" stroke="#52616C" stroke-width="0.75" data-role="area_bar_other"/><rect x="213.80" y="44.00" width="102.20" height="44.00" fill="url(#aa-hatch-other)" stroke="none"/><rect x="24.00" y="104.00" width="12.00" height="12.00" fill="#EEF4F7" stroke="#52616C" stroke-width="0.75" data-role="area_swatch_apartment"/><rect x="24.00" y="104.00" width="12.00" height="12.00" fill="url(#aa-hatch-apartment)" stroke="none"/><text x="42.00" y="114.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="area_label_apartment">Apartment area</text><rect x="24.00" y="124.00" width="12.00" height="12.00" fill="#EEF4F7" stroke="#52616C" stroke-width="0.75" data-role="area_swatch_other"/><rect x="24.00" y="124.00" width="12.00" height="12.00" fill="url(#aa-hatch-other)" stroke="none"/><text x="42.00" y="134.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="area_label_other">Other building area: core, circulation, walls and services</text><text x="24.00" y="150.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="area_measure">Residential floor area</text><text x="24.00" y="170.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="area_conversion">plate = zoning floor area per storey; no gross-up, exclusions or wall-thickness conversion worked</text><text x="24.00" y="190.00" font-size="9.50" text-anchor="start" fill="#111111" data-role="caption">Illustrative area allocation—not a floor plan</text></g>
