<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468.00 224.00" width="468.00" height="224.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" data-drawing="area_allocation" data-kit-version="0">
<title>Area allocation illustration</title>
