<text x="520.00" y="178.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/label">Tax-lot-only estimate</tspan></text>
<text x="520.00" y="192.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/lot/display">Queens block 7334, lot 70</tspan></text>
<text x="520.00" y="206.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00">Assumed conditions</tspan></text>
<text x="520.00" y="220.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/0/key">Zoning district </tspan><tspan data-source="/scope/assumptions/0/value">R6B </tspan><tspan data-source="/scope/assumptions/0/basis">city_records </tspan><tspan data-source="/scope/assumptions/0/statement">Zoning</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/0/statement">district R6B is read from recorded city</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/0/statement">data.</tspan></text>
<text x="520.00" y="254.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/1/key">Commercial overlay present </tspan><tspan data-source="/scope/assumptions/1/value">Yes</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/1/basis">city_records </tspan><tspan data-source="/scope/assumptions/1/statement">A commercial overlay (C2-2)</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/1/statement">is recorded for this lot in the city's</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/1/statement">records.</tspan></text>
<text x="520.00" y="298.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/2/key">Special purpose district </tspan><tspan data-source="/scope/assumptions/2/value">No </tspan><tspan data-source="/scope/assumptions/2/basis">city_records</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/2/statement">The city's records list no special</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/2/statement">purpose district for this lot.</tspan></text>
<text x="520.00" y="332.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/3/key">Special density area </tspan><tspan data-source="/scope/assumptions/3/value">Not known </tspan><tspan data-source="/scope/assumptions/3/basis">assumed</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/3/statement">Whether the lot is in a special density</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/3/statement">area is not known; it is taken to be in</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/3/statement">one for the calculation, so the legal</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/3/statement">dwelling-unit limit that depends on it</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/3/statement">is withheld.</tspan></text>
<text x="520.00" y="396.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/4/key">Lot type </tspan><tspan data-source="/scope/assumptions/4/value">corner </tspan><tspan data-source="/scope/assumptions/4/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/4/statement">The</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/4/statement">lot type (corner) is read from the</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/4/statement">approximate city tax-map outline.</tspan></text>
<text x="520.00" y="430.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/5/key">Lot frontage </tspan><tspan data-source="/scope/assumptions/5/value">103.88 </tspan><tspan data-source="/scope/assumptions/5/unit">feet</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/5/statement">Front lot line</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">assumed to be the Northern Boulevard</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">frontage (the address street); the lot</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">is a corner lot with two frontages (215</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">Place 99.98 ft); which street is legally</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">the front lot line is a qualified-review</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/5/statement">question.</tspan></text>
<text x="520.00" y="514.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/6/key">Lot depth </tspan><tspan data-source="/scope/assumptions/6/value">100 </tspan><tspan data-source="/scope/assumptions/6/unit">feet </tspan><tspan data-source="/scope/assumptions/6/basis">city_records </tspan><tspan data-source="/scope/assumptions/6/statement">The lot</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/6/statement">depth of 100 feet is read from recorded</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/6/statement">city data.</tspan></text>
<text x="520.00" y="548.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/7/key">Site measurement basis </tspan><tspan data-source="/scope/assumptions/7/value">approximate tax</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/7/value">map </tspan><tspan data-source="/scope/assumptions/7/basis">default </tspan><tspan data-source="/scope/assumptions/7/statement">The results carry the label</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/7/statement">of their weakest input; no survey or</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/7/statement">entered measurement was supplied, so the</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/7/statement">weakest recorded source sets the label.</tspan></text>
<text x="520.00" y="602.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/8/key">Within 100 ft of a street-line</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/8/key">intersection </tspan><tspan data-source="/scope/assumptions/8/value">No </tspan><tspan data-source="/scope/assumptions/8/basis">approximate_tax_map</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/8/statement">Measured from the tax-map outline, the</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/8/statement">lot's farthest point is 144.60 feet from</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/8/statement">the corner where its two street lines</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/8/statement">meet, more than 100 feet from it.</tspan></text>
<text x="520.00" y="666.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/9/key">Street-line intersection angle </tspan><tspan data-source="/scope/assumptions/9/value">89.7</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/9/unit">degrees </tspan><tspan data-source="/scope/assumptions/9/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/9/statement">Measured</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/9/statement">from the tax-map outline, the lot's two</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/9/statement">street lines meet at about 89.7 degrees.</tspan></text>
<text x="520.00" y="710.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/10/key">Housing program </tspan><tspan data-source="/scope/assumptions/10/value">standard residence</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/10/basis">default </tspan><tspan data-source="/scope/assumptions/10/statement">Standard residence is used as</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/10/statement">the default housing program.</tspan></text>
<text x="520.00" y="744.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/assumptions/11/key">Floor-to-floor height </tspan><tspan data-source="/scope/assumptions/11/value">10 </tspan><tspan data-source="/scope/assumptions/11/unit">feet </tspan><tspan data-source="/scope/assumptions/11/basis">default </tspan><tspan data-source="/scope/assumptions/11/statement">A</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/11/statement">10-foot floor-to-floor height is used as</tspan><tspan x="520.00" dy="10.00" data-source="/scope/assumptions/11/statement">the default.</tspan></text>
<text x="520.00" y="778.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/whole_site/statement">Based on the lots you selected — the app</tspan><tspan x="520.00" dy="10.00" data-source="/scope/whole_site/statement">does not verify the zoning lot</tspan></text>
<text x="520.00" y="802.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/remaining_capacity/label">Remaining development capacity: Not</tspan><tspan x="520.00" dy="10.00" data-source="/scope/remaining_capacity/label">confirmed</tspan></text>
<text x="520.00" y="826.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/scope/remaining_capacity/reason">Needs verified zoning-lot boundaries and</tspan><tspan x="520.00" dy="10.00" data-source="/scope/remaining_capacity/reason">existing zoning floor area.</tspan></text>
<text x="520.00" y="850.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00">Lot outline: </tspan><tspan data-source="/geometry/measurement/label">Approximate — tax map</tspan></text>
<text x="520.00" y="864.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/geometry/yards/reason">The corner rear-yard waiver does not</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">cover the whole lot: the far corner is</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">144.60 ft from the point where the two</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">street lines meet, beyond the rear-yard</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">waiver area (the waiver covers the area</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">within 100 ft of that point); the two</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">street lines meet at 89.7 degrees,</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">within the waiver's limit of 135</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">degrees. For the part beyond the waiver</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">area, whether a rear yard is required</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">depends on this lot's exact lot lines</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">and on which lot lines of the adjoining</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">lots meet them. The program does not</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">have those facts, so the rear yard is</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/yards/reason">not known.</tspan></text>
<text x="520.00" y="1018.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/geometry/setback_lines_per_level/reason">Setback lines need the ZR 23-433 setback</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/setback_lines_per_level/reason">depths, not encoded in this slice.</tspan></text>
<text x="520.00" y="1042.00" font-size="7.50" fill="#111111" data-role="note"><tspan x="520.00" dy="0.00" data-source="/geometry/floor_plates/reason">No floor plate is drawn: no placement on</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">the lot is worked for any building. The</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">first-building alternatives worked for</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">this lot are listed in</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">building_alternatives, and any building</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">of the method that was not worked is</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">listed, with the reason, in</tspan><tspan x="520.00" dy="10.00" data-source="/geometry/floor_plates/reason">buildings_not_worked.</tspan></text>
</g>
