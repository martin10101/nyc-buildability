<text x="516.00" y="431.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/1/key">Commercial overlay present </tspan><tspan data-source="/scope/assumptions/1/value">Yes</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/1/basis">city_records </tspan><tspan data-source="/scope/assumptions/1/statement">A commercial overlay (C2-2)</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/1/statement">is recorded for this lot in city data.</tspan></text>
<text x="516.00" y="465.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/2/key">Special purpose district </tspan><tspan data-source="/scope/assumptions/2/value">No </tspan><tspan data-source="/scope/assumptions/2/basis">assumed </tspan><tspan data-source="/scope/assumptions/2/statement">No</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/2/statement">special purpose district is assumed to</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/2/statement">apply; this run does not read the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/2/statement">special-district layer.</tspan></text>
<text x="516.00" y="509.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/3/key">Special density area </tspan><tspan data-source="/scope/assumptions/3/value">No </tspan><tspan data-source="/scope/assumptions/3/basis">assumed </tspan><tspan data-source="/scope/assumptions/3/statement">The lot</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">is assumed not to lie in a special</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">density area; this run does not read the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">special-density layer.</tspan></text>
