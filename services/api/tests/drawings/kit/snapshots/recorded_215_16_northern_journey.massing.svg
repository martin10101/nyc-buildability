<text x="516.00" y="587.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/5/key">Lot frontage </tspan><tspan data-source="/scope/assumptions/5/value">103.88 </tspan><tspan data-source="/scope/assumptions/5/unit">feet</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/5/statement">Front lot line</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">assumed to be the Northern Boulevard</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">frontage (the address street); the lot is</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">a corner lot with two frontages (215</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">Place 99.98 ft); which street is legally</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">the front lot line is a qualified-review</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">question.</tspan></text>
<text x="516.00" y="671.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/6/key">Lot depth </tspan><tspan data-source="/scope/assumptions/6/value">100 </tspan><tspan data-source="/scope/assumptions/6/unit">feet </tspan><tspan data-source="/scope/assumptions/6/basis">city_records </tspan><tspan data-source="/scope/assumptions/6/statement">The lot</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/6/statement">depth of 100 feet is read from recorded</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/6/statement">city data.</tspan></text>
<text x="516.00" y="705.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/7/key">Site measurement basis </tspan><tspan data-source="/scope/assumptions/7/value">approximate tax</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/value">map </tspan><tspan data-source="/scope/assumptions/7/basis">default </tspan><tspan data-source="/scope/assumptions/7/statement">The results carry the label</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">of their weakest input; no survey or</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">entered measurement was supplied, so the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">weakest recorded source sets the label.</tspan></text>
<text x="516.00" y="759.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/8/key">Within 100 ft of a street-line</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/key">intersection </tspan><tspan data-source="/scope/assumptions/8/value">Yes </tspan><tspan data-source="/scope/assumptions/8/basis">assumed </tspan><tspan data-source="/scope/assumptions/8/statement">The lot is</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">assumed to lie within 100 feet of a</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">street-line intersection.</tspan></text>
<text x="516.00" y="803.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/9/key">Street-line intersection angle </tspan><tspan data-source="/scope/assumptions/9/value">90 </tspan><tspan data-source="/scope/assumptions/9/unit">degrees</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/9/basis">assumed </tspan><tspan data-source="/scope/assumptions/9/statement">The street lines are assumed to</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/9/statement">meet at a 90-degree angle.</tspan></text>
