<text x="516.00" y="871.59" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/11/key">Floor-to-floor height </tspan><tspan data-source="/scope/assumptions/11/value">10 </tspan><tspan data-source="/scope/assumptions/11/unit">feet </tspan><tspan data-source="/scope/assumptions/11/basis">default </tspan><tspan data-source="/scope/assumptions/11/statement">A</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/11/statement">10-foot floor-to-floor height is used as</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/11/statement">the default.</tspan></text>
