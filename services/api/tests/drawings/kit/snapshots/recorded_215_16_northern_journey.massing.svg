<text x="516.00" y="290.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/label">Tax-lot-only estimate</tspan></text>
<text x="516.00" y="304.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/lot/display">Queens block 7334, lot 70</tspan></text>
<text x="516.00" y="318.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00">Assumed conditions</tspan></text>
<text x="516.00" y="332.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/0/key">Zoning district </tspan><tspan data-source="/scope/assumptions/0/value">R6B </tspan><tspan data-source="/scope/assumptions/0/basis">city_records </tspan><tspan data-source="/scope/assumptions/0/statement">Zoning</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/0/statement">district R6B is read from recorded city</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/0/statement">data.</tspan></text>
<text x="516.00" y="366.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/1/key">Commercial overlay present </tspan><tspan data-source="/scope/assumptions/1/value">Yes</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/1/basis">city_records </tspan><tspan data-source="/scope/assumptions/1/statement">A commercial overlay (C2-2)</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/1/statement">is recorded for this lot in the city's</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/1/statement">records.</tspan></text>
<text x="516.00" y="410.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/2/key">Special purpose district </tspan><tspan data-source="/scope/assumptions/2/value">No </tspan><tspan data-source="/scope/assumptions/2/basis">city_records</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/2/statement">The city's records list no special</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/2/statement">purpose district for this lot.</tspan></text>
<text x="516.00" y="444.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/3/key">Special density area </tspan><tspan data-source="/scope/assumptions/3/value">No </tspan><tspan data-source="/scope/assumptions/3/basis">city_records </tspan><tspan data-source="/scope/assumptions/3/statement">The</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">city's records place this lot outside</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">both special density areas (the Manhattan</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">Core and the Special Downtown Brooklyn</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">District, ZR 12-10), so the legal</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">dwelling-unit limit is shown as a</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/3/statement">conditional ceiling on the zoning lot.</tspan></text>
<text x="516.00" y="518.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/4/key">Lot type </tspan><tspan data-source="/scope/assumptions/4/value">corner </tspan><tspan data-source="/scope/assumptions/4/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/4/statement">The</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/4/statement">lot type (corner) is read from the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/4/statement">approximate city tax-map outline.</tspan></text>
<text x="516.00" y="552.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/5/key">Lot frontage </tspan><tspan data-source="/scope/assumptions/5/value">103.88 </tspan><tspan data-source="/scope/assumptions/5/unit">feet</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/5/statement">Front lot line</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">assumed to be the Northern Boulevard</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">frontage (the address street); the lot is</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">a corner lot with two frontages (215</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">Place 99.98 ft); which street is legally</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">the front lot line is a qualified-review</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/5/statement">question.</tspan></text>
<text x="516.00" y="636.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/6/key">Lot depth </tspan><tspan data-source="/scope/assumptions/6/value">100 </tspan><tspan data-source="/scope/assumptions/6/unit">feet </tspan><tspan data-source="/scope/assumptions/6/basis">city_records </tspan><tspan data-source="/scope/assumptions/6/statement">The lot</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/6/statement">depth of 100 feet is read from recorded</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/6/statement">city data.</tspan></text>
<text x="516.00" y="670.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/7/key">Site measurement basis </tspan><tspan data-source="/scope/assumptions/7/value">approximate tax</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/value">map </tspan><tspan data-source="/scope/assumptions/7/basis">default </tspan><tspan data-source="/scope/assumptions/7/statement">The results carry the label</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">of their weakest input; no survey or</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">entered measurement was supplied, so the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/7/statement">weakest recorded source sets the label.</tspan></text>
<text x="516.00" y="724.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/8/key">Within 100 ft of a street-line</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/key">intersection </tspan><tspan data-source="/scope/assumptions/8/value">No </tspan><tspan data-source="/scope/assumptions/8/basis">approximate_tax_map</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">Measured from the tax-map outline, the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">lot's farthest point is 144.60 feet from</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">the corner where its two street lines</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/8/statement">meet, more than 100 feet from it.</tspan></text>
<text x="516.00" y="788.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/9/key">Street-line intersection angle </tspan><tspan data-source="/scope/assumptions/9/value">89.7</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/9/unit">degrees </tspan><tspan data-source="/scope/assumptions/9/basis">approximate_tax_map </tspan><tspan data-source="/scope/assumptions/9/statement">Measured from</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/9/statement">the tax-map outline, the lot's two street</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/9/statement">lines meet at about 89.7 degrees.</tspan></text>
<text x="516.00" y="832.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/10/key">Housing program </tspan><tspan data-source="/scope/assumptions/10/value">standard residence</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/10/basis">default </tspan><tspan data-source="/scope/assumptions/10/statement">Standard residence is used as the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/10/statement">default housing program.</tspan></text>
<text x="516.00" y="866.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/11/key">Floor-to-floor height </tspan><tspan data-source="/scope/assumptions/11/value">10 </tspan><tspan data-source="/scope/assumptions/11/unit">feet </tspan><tspan data-source="/scope/assumptions/11/basis">default </tspan><tspan data-source="/scope/assumptions/11/statement">A</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/11/statement">10-foot floor-to-floor height is used as</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/11/statement">the default.</tspan></text>
<text x="516.00" y="900.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/assumptions/12/key">Zoning lot </tspan><tspan data-source="/scope/assumptions/12/value">Not confirmed </tspan><tspan data-source="/scope/assumptions/12/basis">city_records </tspan><tspan data-source="/scope/assumptions/12/statement">The</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">city's register of recorded documents</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">lists a zoning lot description filed on</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">this lot together with lot 1 on the same</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">block (recorded February 8, 2022), so the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">zoning lot may include it; the documents</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">were not read. This is not a title</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">search; the app does not verify the</tspan><tspan x="516.00" dy="10.00" data-source="/scope/assumptions/12/statement">zoning lot.</tspan></text>
<text x="516.00" y="994.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/whole_site/statement">Based on the lots you selected — the app</tspan><tspan x="516.00" dy="10.00" data-source="/scope/whole_site/statement">does not verify the zoning lot</tspan></text>
<text x="516.00" y="1018.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/remaining_capacity/label">Remaining development capacity: Not</tspan><tspan x="516.00" dy="10.00" data-source="/scope/remaining_capacity/label">confirmed</tspan></text>
<text x="516.00" y="1042.67" font-size="7.50" fill="#111111" data-role="note"><tspan x="516.00" dy="0.00" data-source="/scope/remaining_capacity/reason">Needs verified zoning-lot boundaries and</tspan><tspan x="516.00" dy="10.00" data-source="/scope/remaining_capacity/reason">existing zoning floor area.</tspan></text>
