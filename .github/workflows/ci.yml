name: CI

# Task M0-T004: remote lint/tests/build for web, api, and contracts.
# No secrets are referenced anywhere in this workflow (scenario S3).
# Installs run only on GitHub-hosted runners, never on the owner's PC
# (docs/LOW_STORAGE_CLOUD_DEVELOPMENT_POLICY.md).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # M0-T019 (FE-S4): pin the npm CLI to the reviewed 11.18.0 (>7 days old,
      # advisory-free at admission) so every install uses the exact,
      # min-release-age-aware package manager — never the runner's default npm.
      - name: Pin npm CLI to 11.18.0
        run: |
          npm install -g npm@11.18.0
          test "$(npm -v)" = "11.18.0" || { echo "npm pin failed: $(npm -v)"; exit 1; }
      # Lockfile is generated by .github/workflows/generate-lockfile.yml on a
      # GitHub runner (never on the owner's PC) and committed to the branch.
      # npm ci is deterministic and verifies lockfile↔package.json + integrity.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # Task M2-T001 (ADDITIVE job; existing jobs untouched): unit tests plus
  # Playwright human journeys for the Property screen. The browser talks to
  # the REAL FastAPI app served by the recorded-official-fixture harness
  # (apps/web/e2e/harness/fixture_api.py) — committed official PLUTO
  # captures through the accepted fetcher-dependency seam, not frontend
  # mocks. Uses only actions already used elsewhere in this file.
  web-e2e:
    name: web-e2e (vitest + Playwright vs recorded-official-fixture API)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      # M0-T020: install the EXACT hash-pinned production runtime tree, then the
      # app itself with --no-deps, so the harness serves the real app from the
      # locked tree (no unpinned pip upgrade, no range resolution). Mirrors the
      # Render / exact-production-install path.
      - name: Install API package (harness serves the real app; from the runtime lock)
        working-directory: services/api
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
      # M0-T019 (FE-S4): pin npm to the reviewed 11.18.0 for the e2e install too.
      - name: Pin npm CLI to 11.18.0
        run: |
          npm install -g npm@11.18.0
          test "$(npm -v)" = "11.18.0" || { echo "npm pin failed: $(npm -v)"; exit 1; }
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Unit and component tests (vitest)
        working-directory: apps/web
        run: npm run test
      - name: Build production bundle (served by `next start` during e2e)
        working-directory: apps/web
        run: npm run build
      - name: Install Playwright chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright human journeys (S1-S8)
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright traces and report for the G3 reviewer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-evidence
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Task M0-T019 (ADDITIVE job; existing jobs untouched): the permanent,
  # machine-enforced dependency-security suite for the web app. BLOCKING on
  # every push and PR — a finding, a too-new package, an integrity mismatch, or
  # an advisory against the pinned npm CLI fails the build. There is no
  # warning-only step, no allowlist, no suppression, and no agent waiver here.
  #   FE-S2  blocking npm audit (all severities, incl. dev deps)
  #   FE-S3  deterministic npm ci (lockfile↔package.json + integrity intact)
  #   FE-S4  pinned npm 11.18.0 + .npmrc min-release-age/save-exact effective
  #   FE-S9  committed-lockfile release-age gate (fail-closed) + its unit tests
  #   FE-S11 continuous npm CLI tooling advisory verification (fail-closed)
  web-dependency-security:
    name: web-dependency-security (audit + committed-lock age gate + npm CLI advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # FE-S4: the exact reviewed npm CLI. Everything below runs under it.
      - name: Pin npm CLI to 11.18.0
        run: |
          npm install -g npm@11.18.0
          test "$(npm -v)" = "11.18.0" || { echo "npm pin failed: $(npm -v)"; exit 1; }
      # FE-S9 LOGIC regressions: the 604800/604799 boundary, integrity/host
      # checks, every fail-closed branch, retry→INFRASTRUCTURE_UNAVAILABLE, and
      # the FE-S11 advisory decision. Node built-in runner; no install needed.
      - name: Age-gate + npm-CLI-advisory deterministic unit tests
        run: node --test scripts/tests/*.test.mjs
      # FE-S3: deterministic install. `npm ci` fails if the committed lock is
      # missing or does not match package.json, and verifies every tarball's
      # integrity against the lock. --no-audit keeps this step deterministic;
      # the BLOCKING audit is the explicit separate step below.
      - name: Deterministic install (npm ci; lockfile + integrity verified)
        run: npm ci --no-audit --no-fund
      # FE-S2 (a): the canonical blocking audit. Exits non-zero on ANY finding
      # at low or above, across runtime AND dev dependencies. No --omit=dev.
      - name: Blocking npm audit (--audit-level=low; dev deps included)
        run: npm audit --audit-level=low
      # FE-S2 (b): stricter belt-and-suspenders — parse the audit JSON and fail
      # if the total across EVERY severity bucket (info..critical) is non-zero.
      - name: Blocking npm audit (JSON total vulnerabilities must be 0)
        run: |
          set -o pipefail
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const a = require(process.env.RUNNER_TEMP + "/audit.json");
            const v = (a.metadata && a.metadata.vulnerabilities) || {};
            const total = Object.values(v).reduce((s, n) => s + (typeof n === "number" ? n : 0), 0);
            if (total !== 0) {
              console.error("npm audit JSON reports " + total + " vulnerabilities:", JSON.stringify(v));
              process.exit(1);
            }
            console.log("npm audit JSON: total vulnerabilities == 0 across all severities");
          '
      # FE-S9: independent committed-lockfile release-age gate. Parses the whole
      # committed package-lock.json, re-verifies every registry package resolves
      # to registry.npmjs.org with a registry-matching integrity and is >= 7
      # complete days old, against the registry's own UTC clock. Fails closed.
      - name: Committed-lockfile release-age gate (>= 7 days, fail-closed)
        run: node scripts/dependency_age_gate.mjs package-lock.json
      # FE-S11: the pinned npm CLI must itself be advisory-free (fail-closed).
      - name: npm CLI tooling advisory verification (npm@11.18.0, fail-closed)
        run: node scripts/dependency_age_gate.mjs --npm-cli-advisory 11.18.0

  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      # M0-T020: no more `pip install .[dev]` range resolution and no unpinned
      # pip upgrade. Tools (ruff, pytest, httpx, ...) come from the hash-pinned
      # tooling lock; the app's runtime deps come from the hash-pinned production
      # lock; the app itself installs with --no-deps so ONLY the two locks supply
      # dependencies.
      - name: Install tooling from the hash-pinned tooling lock
        run: pip install --require-hashes -r requirements-tools.lock
      - name: Install runtime deps from the hash-pinned production lock
        run: pip install --require-hashes -r requirements.txt
      - name: Install app package only (no deps — both locks already pinned)
        run: pip install --no-deps .
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  # Task M0-T018 (ADDITIVE job; existing jobs untouched): prove the committed
  # production lock services/api/requirements.txt is a byte-identical, up-to-date
  # regeneration from requirements.in. Uses a PINNED uv (resolver output can
  # change across uv releases) and the same --universal / --python-version 3.12
  # / --generate-hashes flags Render's build reproducibility depends on. Fails
  # loudly if requirements.txt drifts from requirements.in (someone edited the
  # lock by hand or forgot to regenerate). No app install needed.
  api-lock-verify:
    name: api-lock-verify (requirements.txt is a fresh hash-pinned uv lock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # M0-T020: bootstrap the PINNED uv (0.11.28) FROM the hash-pinned tooling
      # lock using the runner's existing pip — never download an unlocked
      # `uv==...` first. The lock hash-pins uv itself (require-hashes verifies
      # every artifact); installing the whole lock puts the `uv` console script
      # on PATH so lock_requirements.sh --check finds exactly uv 0.11.28.
      - name: Install pinned uv from the tooling lock (hash-verified)
        run: pip install --require-hashes -r requirements-tools.lock
      - name: Verify requirements.txt is byte-identical to a fresh lock
        run: bash scripts/lock_requirements.sh --check

  # Task M0-T020 (ADDITIVE job): prove the Python TOOLING lock
  # (services/api/requirements-tools.lock) is a byte-identical, up-to-date
  # regeneration of requirements-tools.in via the PINNED uv (bootstrapped FROM
  # the lock itself), and run the release-age gate's deterministic unit tests
  # (which the `api` job's testpaths=["tests"] does not collect). The live age
  # gate and the dual pip-audit run in exact-production-install and
  # scheduled-audit; this job guards the lock's integrity and the gate's logic.
  api-tooling-lock-verify:
    name: api-tooling-lock-verify (tooling lock byte-identical + age-gate unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Bootstrap the pinned uv (0.11.28) + pytest FROM the hash-pinned tooling
      # lock using the runner's existing pip — never download an unlocked uv or
      # pytest first. Puts the `uv` console script on PATH for lock_tools.sh.
      - name: Install tooling from the tooling lock (hash-verified)
        run: pip install --require-hashes -r requirements-tools.lock
      - name: Verify requirements-tools.lock is byte-identical to a fresh lock
        run: bash scripts/lock_tools.sh --check
      # Age-gate LOGIC regressions: 604800 PASS / 604799 FAIL boundary and every
      # fail-closed branch (deterministic, offline, injected UTC now).
      - name: Age-gate deterministic unit tests
        run: pytest scripts/tests -q

  # Task M0-T018 (ADDITIVE job; existing jobs untouched): the EXACT Render
  # production install path, exercised end to end. This is the authoritative
  # proof that the deployed dependency tree is complete (jsonschema present),
  # advisory-clean, and actually runs validate_profile — the health endpoint
  # cannot prove this because contract.py imports jsonschema lazily.
  exact-production-install:
    name: exact-production-install (Render pip install path + validate_profile + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Clean env, EXACTLY Render's build command (render.yaml buildCommand:
      # `pip install -r requirements.txt`). --require-hashes is implied because
      # the lock is fully hashed; make it explicit so an unhashed line fails.
      # M0-T020: the unpinned `pip install --upgrade pip` is removed; pip is
      # pinned in the tooling lock and installed into the isolated audit venv
      # below (the runner's stock pip is sufficient for a hash-verified install).
      - name: Install production tree via Render's exact command (hash-verified)
        run: pip install --require-hashes -r requirements.txt
      # Make the real app importable without dev extras (mirrors the production
      # image / web-e2e non-editable install): install the package itself with
      # NO dependencies so ONLY the locked production tree above provides them.
      - name: Install app package only (no deps — production tree already pinned)
        run: pip install --no-deps .
      - name: pip check (no broken/conflicting requirements)
        run: pip check
      # M0-T020: pip-audit (and its OWN transitive tree) is installed into a
      # SEPARATE venv from the hash-pinned tooling lock — no `pipx run --spec`
      # dynamic transitive resolution — so the audit tool is exact and audited
      # and never perturbs the pinned production tree the pytest step runs
      # against. The lock hash-pins pip-audit and every transitive.
      - name: Create isolated audit venv and install pip-audit from the tooling lock
        run: |
          python -m venv "$RUNNER_TEMP/auditenv"
          "$RUNNER_TEMP/auditenv/bin/pip" install --require-hashes -r requirements-tools.lock
      # DUAL audit, BLOCKING at every severity. Each lock is a full transitive
      # closure, so `-r <lock> --no-deps --strict` audits exactly the pinned
      # versions; --strict fails if any pinned package cannot be audited. There
      # is no --ignore-vuln / allowlist / print-only downgrade anywhere. The
      # starlette 1.3.1 pin clears the prior nine advisories
      # (PYSEC-2026-161/248/249/1941/1942/2280/2281).
      - name: pip-audit — PRODUCTION lock must have ZERO advisories (blocking)
        run: |
          "$RUNNER_TEMP/auditenv/bin/pip-audit" -r requirements.txt --no-deps --strict
      - name: pip-audit — TOOLING lock must have ZERO advisories (blocking)
        run: |
          "$RUNNER_TEMP/auditenv/bin/pip-audit" -r requirements-tools.lock --no-deps --strict
      # M0-T020: machine-enforced release-age gate over BOTH locks (direct AND
      # transitive), using live PyPI metadata + PyPI's own UTC clock. Every
      # admitted artifact must be >= 604800 s old or the build fails closed. The
      # gate is stdlib-only, so it runs on the isolated audit venv's Python.
      - name: Dependency release-age gate — both locks, >= 7 days (blocking)
        run: |
          "$RUNNER_TEMP/auditenv/bin/python" scripts/dependency_age_gate.py requirements.txt requirements-tools.lock
      - name: POSITIVE smoke — create_app + validate_profile on a valid fixture
        run: python scripts/exact_install_smoke.py
      # NEGATIVE smoke (the key proof): remove jsonschema, the SAME gate must
      # FAIL loudly inside validate_profile. Proves the smoke exercises the
      # runtime import, not a health endpoint.
      - name: NEGATIVE smoke — jsonschema removed makes validate_profile FAIL
        run: |
          pip uninstall -y jsonschema
          python scripts/exact_install_smoke.py --expect-missing-jsonschema
      - name: Restore the production tree from the locked lock (hash-verified)
        run: pip install --require-hashes -r requirements.txt
      # DP-S5: run the FULL API suite against the production-installed tree. The
      # test tools (pytest, httpx TestClient transport, ...) are added from the
      # hash-pinned TOOLING lock — no `.[dev]` range resolution. The two locks
      # share six transitives (anyio, colorama, h11, idna, pyyaml,
      # typing-extensions) at IDENTICAL versions, so the production runtime tree
      # is preserved exactly (verified by the pip check above and re-run here);
      # this proves the production tree runs the whole suite.
      - name: Install test tools from the tooling lock (hash-verified)
        run: pip install --require-hashes -r requirements-tools.lock
      - name: pip check after adding test tools (production pins preserved)
        run: pip check
      - name: Pytest against the production-installed tree
        run: pytest -q

  contracts:
    name: contracts (JSON Schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Uses only the runner's preinstalled Python. The contract-schema
      # validator is stdlib-only. PyYAML (for the render.yaml syntax check) is
      # installed hash-pinned from the tooling lock — M0-T020 replaced the
      # unpinned `pip install --quiet pyyaml` so no audited Python path resolves
      # a package outside the two locks.
      - name: Validate contract schemas
        run: python3 .github/scripts/validate_contracts.py
      - name: Install PyYAML from the hash-pinned tooling lock
        run: python3 -m pip install --require-hashes -r services/api/requirements-tools.lock
      - name: Validate render.yaml (Blueprint YAML syntax)
        run: python3 -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8'))"

  # Task M2-T003 (ADDITIVE job; existing jobs untouched): deterministic
  # TypeScript type-generation drift check for the canonical property-profile
  # contract. Regenerates the committed types with a STDLIB-ONLY Python
  # generator (no Node toolchain, no network - thin-client policy) and fails
  # if packages/contracts/generated/property_profile.ts diverges byte-for-byte.
  # Also runs the generator's own determinism + 100%-key-coverage tests.
  contracts-typegen:
    name: contracts-typegen (TS drift check, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Byte-identical drift check: the committed generated file must equal a
      # fresh generation. --check exits non-zero on any divergence. The
      # generator itself is stdlib-only, so this step needs no dependencies.
      - name: Check generated TypeScript types are up to date
        run: python3 packages/contracts/scripts/generate_ts_types.py --check
      # pytest for the generator's determinism + 100%-key-coverage tests (only
      # test-time dependency; the generator has none). M0-T020: installed
      # hash-pinned from the tooling lock (pytest 9.0.3) — the ranged
      # `pytest>=8,<9` install is removed so this audited Python path resolves
      # nothing outside the two locks.
      - name: Install pytest from the hash-pinned tooling lock
        run: python3 -m pip install --require-hashes -r services/api/requirements-tools.lock
      - name: Run type-generator tests
        run: python3 -m pytest packages/contracts/scripts/tests -q

  # Task M2-T003 rework (ADDITIVE job; existing jobs untouched): prove the
  # runtime-bundled contract schemas shipped inside the installed api package
  # (services/api/app/_contract_schemas/v1/*.schema.json) are byte-identical to
  # the CANONICAL source (packages/contracts/schemas/v1/*.schema.json). The
  # canonical source stays authoritative; the bundled copies are build
  # artifacts kept provably in sync so the non-editable install (web-e2e,
  # production) loads the exact canonical schemas via importlib.resources.
  # Stdlib-only; mirrors the contracts-typegen drift-check pattern.
  contracts-schema-bundle:
    name: contracts-schema-bundle (runtime schema drift check, byte-identical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # --check exits non-zero if any bundled copy is missing or diverges.
      # The sync script is stdlib-only, so this step needs no dependencies.
      - name: Check runtime-bundled contract schemas are byte-identical to canonical
        run: python3 services/api/scripts/sync_contract_schemas.py --check

  control-plane:
    name: control-plane (workflow regression test, ADR-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Stdlib only; proves producer-submit / reviewer-report /
      # orchestrator-gate authority rules and bootstrap defect regressions.
      - name: Run project-control regression test
        run: python3 tools/test_project_control.py
      # B-007 dispatch guard (owner directive 2026-07-17): the five expansion agents
      # must be programmatically rejected while B-007 is open; roster agents unaffected.
      - name: Run agent dispatch-guard rejection test
        run: python3 tools/test_agent_dispatch_guard.py
      # Owner Directive Compliance System (D-001, task M0-T023): stdlib-only registry
      # integrity + CLI enforcement + reminder-hook + read-only-guard-roster regressions.
      # Added to the already-required control-plane job so a failure blocks merge
      # (connected check; no branch-protection change needed).
      - name: Validate directive-compliance registry (real project-control/directives)
        run: python3 tools/validate_directive_compliance.py --check
      - name: Run directive-compliance validator + adversarial tests
        run: python3 tools/test_directive_compliance.py
      - name: Run directive-compliance reminder-hook tests
        run: python3 tools/test_directive_reminder.py
      - name: Run read-only reviewer guard test (governed roster incl. directive-compliance-verifier)
        run: python3 tools/test_readonly_agent_guard.py
      # MCP default-deny policy (D-020, task M0-T077): the checked-in project settings
      # must keep every ordinary session free of unrelated external MCP servers.
      # Added to the existing control-plane job so removing or weakening the policy
      # fails this job on every push and PR. (Failing checks gate merges only to the
      # extent branch protection requires them — a pre-existing repository setting
      # this task does not change; G3 F-6.)
      - name: Validate MCP default-deny policy (.claude/settings.json invariants)
        run: python3 tools/validate_mcp_policy.py --check
      - name: Run MCP default-deny policy validator tests
        run: python3 tools/test_mcp_policy.py

  # Task M0-T022 (ADDITIVE job; existing jobs untouched): integrity gate for the
  # owner dashboard's one new metadata file, project-control/product-map.json.
  # Stdlib only. Proves every ledger task maps to exactly one product system,
  # eng_weight and launch_weight each sum to 100, and every referenced id
  # resolves - so the read-only dashboard's two progress numbers can never be
  # computed from a product map that has silently drifted from the ledger.
  product-map:
    name: product-map (owner-dashboard metadata integrity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate product-map.json against the ledger
        run: python3 tools/validate_product_map.py --check
      - name: Run product-map validator unit tests
        run: python3 tools/test_product_map.py

  # Task M0-T030 (ADDITIVE job; existing jobs untouched): in-house code-
  # navigation index (D-005 V1). Stdlib only, no third-party actions beyond
  # the SHA-pinned checkout already used everywhere in this file, no
  # dependencies installed, no artifact committed (the graph is generated
  # into temp/cache dirs OUTSIDE the repo, so no product PR can ever fail
  # because the graph went stale). --check is the determinism self-proof:
  # two fresh generations on the runner must be byte-identical. The test
  # suite runs on temp fixture repos only (never the live repo composition).
  code-graph:
    name: code-graph (determinism --check + fixture tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Determinism self-proof (two fresh generations, byte-identical)
        run: python3 tools/code_graph/generate.py --repo . --check
      - name: Run code-graph fixture test suite
        run: python3 tools/test_code_graph.py

  # M0-T063 Unit A1 (D-013, ADDITIVE job; existing jobs untouched): the
  # context-intelligence foundation - repository fingerprint + per-file
  # manifest, crash-safe cache generations, and the baseline harness. Stdlib
  # only (git + code_graph, both already present); the three test modules are
  # the packet's documented_test_commands. Deterministic; no network, no
  # secrets. SHA-pinned checkout identical to the sibling jobs.
  context-index-a1:
    name: context-index-a1 (fingerprint + cache + baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Repository fingerprint tests
        run: python3 tools/test_repo_fingerprint.py
      - name: Index cache crash-safety tests
        run: python3 tools/test_repo_index_cache.py
      - name: Baseline harness tests
        run: python3 tools/test_repo_index_baseline.py
      - name: Byte-identical assembly driver tests (A2)
        run: python3 tools/test_repo_index_assembly.py
      - name: Incremental indexing + selective-reparse + parity tests (A2)
        run: python3 tools/test_repo_index_incremental.py

  # Task M0-T036 (ADDITIVE job; existing jobs untouched; owner CI grant
  # 2026-08-03, D-007-R543..R550): run the supervisor-bridge test suite with
  # the exact invocation standing grant (a) uses locally. The suite and the
  # tools/agent_supervisor package are stdlib-only; pytest is the only tool
  # needed and installs hash-pinned from the tooling lock (same pattern as
  # contracts-typegen). Uses only actions already SHA-pinned elsewhere in
  # this file; no secrets, tokens, or new external actions.
  # windows-latest, deliberately: the supervisor is a Windows-targeted
  # component (Job Objects containment, named-pipe IPC, Task Scheduler wake)
  # and the suite is Windows-proven; its only ubuntu execution starved the
  # hosted runner to death ("runner lost communication", 2026-08-03).
  # bash shell so the grant-(a) glob expands identically to local runs.
  supervisor-bridge:
    name: supervisor-bridge (pytest tools/test_agent_supervisor_*.py)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest from the hash-pinned tooling lock
        shell: bash
        run: python -m pip install --require-hashes -r services/api/requirements-tools.lock
      # M0-T126 (D-024-R372; M0-T125 D1/D14/D15/D17): the command-document
      # validation tooth. Extracts every presented supervisor command from the
      # living operator runbook and dry-runs it against the LIVE parser/seam
      # contract (pinned start flags + dispatch inputs). Fails closed on any
      # drift — the guard the live exit-11 refusal escaped because no test parsed
      # the presented documents. Stdlib-only; launches nothing.
      - name: Command-document validation (presented commands vs live contract)
        shell: bash
        run: python tools/supervisor_command_doc_check.py
      - name: Supervisor test suite
        shell: bash
        run: pytest tools/test_agent_supervisor_*.py

  # M0-T073 (D-017-R110, ADDITIVE job; existing jobs untouched): permanent
  # modularity enforcement. Stdlib only. --check fails on a NEW handwritten
  # production file above the hard threshold or material growth of a
  # grandfathered oversized file without a reviewed, expiring, path-exact
  # exception; legacy debt is reported via the reviewed baseline, never
  # retro-failed. The proof tests demonstrate pass/fail/exception/baseline
  # semantics including that baseline regeneration cannot erase live debt.
  modularity:
    name: modularity (deterministic size/responsibility regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Modularity policy check (fail-closed)
        run: python3 tools/modularity_check.py --check
      - name: Modularity checker proof tests
        run: python3 tools/test_modularity_check.py

  # M0-T074 (D-017-R122, ADDITIVE job; existing jobs untouched): deterministic
  # complexity-based model routing. Stdlib only. Prevents an unauthorized
  # model, a self-selected model, an unrecorded fallback, or an ungrounded
  # complexity classification, and pins the frozen routing corpus (simple
  # tasks stay inexpensive; HIGH/CRITICAL can never route weaker).
  model-routing:
    name: model-routing (frozen corpus + allowlist boundary tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Model routing tests
        run: python3 tools/test_model_routing.py

  # M0-T075 (D-018-R053, ADDITIVE job; existing jobs untouched): the complete
  # context-pipeline surface — Units B (compiler + index consumption),
  # C (ontology), D (memory graph), E (views), F (benchmark + projection) —
  # plus the M0-T075 integration/adversarial suite (two-writer race,
  # containment probes, entry-point wiring, retention). Stdlib only. This job
  # never replaces the unit-scoped jobs above; it is the permanent
  # end-to-end regression net for the ONE context compiler.
  context-pipeline:
    name: context-pipeline (Units B-F suites + integration/adversarial tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Unit B compiler suites
        run: |
          python3 tools/test_context_pack.py
          python3 tools/test_context_pack_index.py
      - name: Unit C ontology suite
        run: python3 tools/test_subsystem_resolver.py
      - name: Unit D memory-graph suite
        run: python3 tools/test_memory_graph.py
      - name: Unit E views suite
        run: python3 tools/test_repo_views.py
      - name: Unit F benchmark + projection suites
        run: |
          python3 tools/test_context_benchmark.py
          python3 tools/test_status_projection.py
      - name: M0-T075 integration + adversarial suite
        run: python3 tools/test_context_integration.py
      # M0-T076 / D-019-R036/R037: the COMPLETE clean-checkout end-to-end
      # compiler benchmark runs on every push/PR (this checkout IS a clean
      # checkout of merged/PR HEAD), reproducing the frozen apples-to-apples
      # baseline comparison — not only the single-shape unit test. Exits nonzero
      # on any required-evidence regression, gating the pipeline.
      - name: Clean-checkout e2e compiler benchmark (frozen baseline)
        run: |
          python3 tools/context_benchmark.py --e2e \
            --baseline project-control/reports/M0-T076-baseline-g0.json
